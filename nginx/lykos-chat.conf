# ============================================================
#  Nginx - Reverse proxy para Lykos Chat
#  Copiar a: /etc/nginx/sites-available/lykos-chat
#  Symlink:  ln -s /etc/nginx/sites-available/lykos-chat /etc/nginx/sites-enabled/
#  SSL:      certbot --nginx -d tu-dominio.com
# ============================================================

# Upstream del servidor Node.js
upstream lykos_chat {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com;

    # Redirigir todo a HTTPS (despues de obtener el certificado)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com;

    # --- SSL (Certbot rellena estas lineas automaticamente) ---
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Limits ---
    client_max_body_size 20m;

    # --- Reverse proxy + WebSocket (Socket.io) ---
    location / {
        proxy_pass http://lykos_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para conexiones long-lived (WebSocket)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
