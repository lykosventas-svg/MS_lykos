<!DOCTYPE html>
<html lang="es" x-data="app()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://lykos.mx/wp-content/uploads/2020/05/Logotipo-Likos_Mesa-de-trabajo-1-e1590453401721.png" />
  <title>Lykos Chat — Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    tailwind.config = { theme: { extend: { colors: {
      brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',400:'#3b82f6',500:'#2563eb',600:'#0d2b4e',700:'#0a223d',900:'#06203a' }
    }}}}
  </script>
</head>
<body class="min-h-screen">

  <!-- ============ LOGIN ============ -->
  <template x-if="view==='login'">
    <div class="min-h-screen flex items-center justify-center px-4" style="background: #ffffff;">
      <div class="login-wrap">
        <div class="text-center">
          <img src="https://lykos.mx/wp-content/uploads/2020/04/logo-lykos.png" alt="Lykos" class="login-logo" />
          <p class="login-subtitle">Panel de administración para WhatsApp</p>
        </div>
        <form @submit.prevent="doLogin()" class="login-form-layout">
          <input x-model="loginForm.username" type="text" class="login-input" placeholder="Usuario" autocomplete="username" />
          <div class="login-input-wrap">
            <input x-model="loginForm.password" :type="showLoginPass ? 'text' : 'password'" class="login-input login-input-pass" placeholder="Contraseña" autocomplete="current-password" />
            <button type="button" class="login-pass-toggle" aria-label="Mostrar contraseña"
              @mousedown="showLoginPass = true" @mouseup="showLoginPass = false" @mouseleave="showLoginPass = false"
              @touchstart.prevent="showLoginPass = true" @touchend="showLoginPass = false">
              <svg x-show="!showLoginPass" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1 1 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178a1 1 0 010 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <svg x-show="showLoginPass" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.983A10.457 10.457 0 0012 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639A10.457 10.457 0 0112 19.5c-4.638 0-8.573-3.007-9.963-7.178a1 1 0 010-.639"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75a3 3 0 015.25 2.122v.378a3 3 0 01-5.25 2.122M3 3l18 18"/></svg>
            </button>
          </div>
          <template x-if="loginError">
            <p class="login-error" x-text="loginError"></p>
          </template>
          <button type="submit" :disabled="loginLoading" class="login-btn">
            <span x-show="!loginLoading">Ingresar</span>
            <span x-show="loginLoading">Verificando...</span>
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- ============ PANEL ============ -->
  <template x-if="view==='panel'">
    <div class="h-screen flex flex-col">

      <!-- Navbar -->
      <header class="navbar">
        <div class="flex items-center gap-3">
          <button @click="sidebarOpen = !sidebarOpen" class="navbar-toggle">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="navbar-brand" @click="changeTab('inicio')" style="cursor: pointer;">
            <img src="https://lykos.mx/wp-content/uploads/2020/04/cropped-Logotipo-Lykos.png" alt="Lykos" style="height: 32px; width: auto; object-fit: contain;" />
            <span>LYKOS CHAT</span>
          </div>
        </div>
        <div class="navbar-right">
          <span class="navbar-welcome">Bienvenido</span>
          <span class="navbar-user" x-text="user?.nombre || user?.username"></span>
          <button @click="logout()" class="navbar-logout">Salir</button>
        </div>
      </header>

      <!-- Layout: sidebar + contenido -->
      <div class="flex flex-1 overflow-hidden">

        <!-- Overlay para sidebar en móvil -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'w-60' : 'w-0'" class="sidebar">
          <div class="sidebar-inner">
            <button @click="changeTab('inicio')" :class="tab==='inicio' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span>Inicio</span>
            </button>

            <div class="sidebar-section" x-show="user?.role==='admin'">Configuración</div>

            <button x-show="user?.role==='admin'" @click="changeTab('whatsapp')" :class="tab==='whatsapp' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.04 2 11c0 2.52 1.17 4.79 3.04 6.42L4 22l4.7-1.46C9.73 21 10.84 21 12 21c5.52 0 10-4.04 10-9s-4.48-9-10-9z"/></svg>
              <span>WhatsApp</span>
            </button>

            <button x-show="user?.role==='admin'" @click="changeTab('ia')" :class="tab==='ia' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.5.8a2 2 0 11-3.464 0l.5-.8z"/></svg>
              <span>Inteligencia Artificial</span>
            </button>

            <button x-show="user?.role==='admin'" @click="changeTab('bot')" :class="tab==='bot' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h10M4 18h10"/></svg>
              <span>Flujos del Bot</span>
            </button>

            <div class="sidebar-section" style="margin-top: 16px;">Operación</div>

            <button @click="changeTab('agentes')" :class="tab==='agentes' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
              <span>Agentes</span>
            </button>

            <button @click="changeTab('contactos')" :class="tab==='contactos' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>Contactos</span>
            </button>

            <button x-show="user?.role==='admin'" @click="changeTab('masivos')" :class="tab==='masivos' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <span>Mensajes Masivos</span>
            </button>

            <button x-show="user?.role==='admin'" @click="changeTab('metricas')" :class="tab==='metricas' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              <span>Métricas</span>
            </button>

            <div class="sidebar-section" style="margin-top: 16px;" x-show="user?.role==='admin'">Administración</div>

            <button x-show="user?.role==='admin'" @click="changeTab('usuarios')" :class="tab==='usuarios' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.286c1.376-.836 2.96.576 2.122 1.952a1.724 1.724 0 001.286 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.286 2.573c.836 1.376-.576 2.96-1.952 2.122a1.724 1.724 0 00-2.573 1.286c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.286c-1.376.836-2.96-.576-2.122-1.952a1.724 1.724 0 00-1.286-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.286-2.573c-.836-1.376.576-2.96 1.952-2.122a1.724 1.724 0 002.573-1.286z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>Usuarios</span>
            </button>

            <button x-show="user?.role==='admin'" @click="toggleNotifExpand()" :class="tab==='notificaciones' ? 'nav-active' : 'nav-item'" class="nav-item">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5v-5a7 7 0 00-14 0v5h5m4 0v3m-4-3v3M9 7a3 3 0 016 0"/></svg>
              <span>Notificaciones</span>
              <span class="nav-chevron" x-text="notifExpanded ? '▾' : '›'"></span>
            </button>

            <div class="nav-submodules" x-show="user?.role==='admin' && notifExpanded" x-transition.duration.200ms>
              <button @click="selectNotifSubtab('notif-global')" :class="subtab==='notif-global' ? 'subnav-active' : 'subnav-item'" class="subnav-item">
                <span>Configuración general</span>
              </button>
              <button @click="selectNotifSubtab('notif-usuarios')" :class="subtab==='notif-usuarios' ? 'subnav-active' : 'subnav-item'" class="subnav-item">
                <span>Notificaciones por usuario</span>
              </button>
              <button @click="selectNotifSubtab('notif-log')" :class="subtab==='notif-log' ? 'subnav-active' : 'subnav-item'" class="subnav-item">
                <span>Historial de envíos</span>
              </button>
            </div>

            <div class="sidebar-footer">
              Sesión: <span class="font-semibold" x-text="user?.role"></span>
            </div>
          </div>
        </aside>

        <!-- Contenido -->
        <main class="flex-1" :class="tab==='agentes' ? 'flex flex-col overflow-hidden' : 'overflow-y-auto'" style="background: var(--bg-soft);">
          <div :class="tab==='agentes' ? 'flex flex-col flex-1 min-h-0' : (tab==='inicio' ? 'max-w-[1300px] mx-auto p-6' : 'p-4')">

          <!-- ===== INICIO ===== -->
          <template x-if="tab==='inicio'">
            <div class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card home-action-card">
                  <div class="home-action-content">
                    <img src="https://lykos.mx/wp-content/uploads/2026/09/icono-de-bot.webp" alt="Icono bot" class="home-profile-icon">
                    <div>
                      <h2 class="card-title" style="margin:0 0 6px;">¿Necesitas ayuda o apoyo?</h2>
                      <p class="text-sm" style="color:var(--text-soft);margin:0;">Inicia el asistente de IA para automatizar procesos, recibir ayuda y resolver dudas de soporte tecnico.</p>
                    </div>
                    <button class="btn-primary" style="text-transform:uppercase;letter-spacing:.03em;font-size:13px;">Iniciar</button>
                  </div>
                </div>
                <div class="card home-action-card">
                  <div class="home-action-content">
                    <div>
                      <h2 class="card-title" style="margin:0 0 6px;">¿Tienes dudas?</h2>
                      <p class="text-sm" style="color:var(--text-soft);margin:0;">Lee el manual de Lykos chat</p>
                    </div>
                    <button class="btn-primary" style="text-transform:uppercase;letter-spacing:.03em;font-size:13px;">Revisar</button>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 items-start">
                <div class="home-quick-card" @click="changeTab('whatsapp')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.04 2 11c0 2.52 1.17 4.79 3.04 6.42L4 22l4.7-1.46C9.73 21 10.84 21 12 21c5.52 0 10-4.04 10-9s-4.48-9-10-9z"/></svg></div>
                    <div><h3 class="home-quick-title">WhatsApp</h3><p class="home-quick-sub">Configura tu conexion de WhatsApp</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('ia')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.5.8a2 2 0 11-3.464 0l.5-.8z"/></svg></div>
                    <div><h3 class="home-quick-title">Inteligencia Artificial</h3><p class="home-quick-sub">Administra la IA de tu bot</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('bot')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h10M4 18h10"/></svg></div>
                    <div><h3 class="home-quick-title">Flujos del Bot</h3><p class="home-quick-sub">Administra tus flujos conversacionales</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('masivos')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div>
                    <div><h3 class="home-quick-title">Mensajes Masivos</h3><p class="home-quick-sub">Envia campanas masivas</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('metricas')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div>
                    <div><h3 class="home-quick-title">Métricas</h3><p class="home-quick-sub">Visualiza el rendimiento del sistema</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('usuarios')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
                    <div><h3 class="home-quick-title">Usuarios</h3><p class="home-quick-sub">Gestiona los usuarios del sistema</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('agentes')">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
                    <div><h3 class="home-quick-title">Agentes</h3><p class="home-quick-sub">Atiende conversaciones en tiempo real</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('contactos')">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
                    <div><h3 class="home-quick-title">Contactos</h3><p class="home-quick-sub">Administra tus contactos de WhatsApp</p></div>
                  </div>
                </div>
                <div class="home-quick-card" @click="changeTab('notificaciones')" x-show="user?.role==='admin'">
                  <div class="home-quick-curve"></div>
                  <div class="home-quick-body">
                    <div class="home-quick-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5v-5a7 7 0 00-14 0v5h5m4 0v3m-4-3v3M9 7a3 3 0 016 0"/></svg></div>
                    <div><h3 class="home-quick-title">Notificaciones</h3><p class="home-quick-sub">Configura alertas a tu equipo</p></div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- ===== WHATSAPP ===== -->
          <template x-if="tab==='whatsapp'">
            <div class="grid-2">
              <div class="card">
                <h2 class="card-title">Configuración de WhatsApp Cloud API</h2>
                <div class="form-grid">
                  <div class="field">
                    <label class="field-label">Phone Number ID</label>
                    <input x-model="wa.phone_number_id" class="input" placeholder="123456789" />
                  </div>
                  <div class="field">
                    <label class="field-label">WABA ID</label>
                    <input x-model="wa.waba_id" class="input" placeholder="123456789" />
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">Token de acceso</label>
                  <div class="input-group">
                    <input :type="showWaToken ? 'text' : 'password'" x-model="wa.access_token" class="input" :placeholder="wa.has_token ? 'Guardado (escribe para reemplazar)' : 'Permanent Access Token'" />
                    <button @click="showWaToken=!showWaToken" class="btn-ghost btn-sm" x-text="showWaToken ? 'Ocultar' : 'Mostrar'"></button>
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">App Secret</label>
                  <div class="input-group">
                    <input :type="showAppSecret ? 'text' : 'password'" x-model="wa.app_secret" class="input" :placeholder="wa.has_app_secret ? 'Guardado (escribe para reemplazar)' : 'App Secret'" />
                    <button @click="showAppSecret=!showAppSecret" class="btn-ghost btn-sm" x-text="showAppSecret ? 'Ocultar' : 'Mostrar'"></button>
                  </div>
                  <p class="field-help">Encuéntralo en developers.facebook.com > tu App > Configuración > Básica > App Secret.</p>
                </div>
                <div class="form-grid">
                  <div class="field">
                    <label class="field-label">Verify Token</label>
                    <div class="input-group">
                      <input x-model="wa.verify_token" class="input input-mono" readonly />

                      <label class="radio-card" :class="iaConfigForm.ia_mode==='principal' ? 'radio-active' : ''"><input type="radio" x-model="iaConfigForm.ia_mode" value="principal" class="hidden" /><span class="font-semibold text-sm">IA como principal</span><span class="field-help">Toda la conversación la maneja la IA.</span></label>

                            </div>
                          </div>
                          <div class="wa-conv-lastmsg" x-text="c.ultimo_mensaje"></div>
                          <div class="wa-conv-takenby" x-show="c.agente_id" x-text="'🔒 ' + (c.agente_username || 'tomada')"></div>

                    <p x-show="convs.length===0" class="text-center text-sm p-8" style="color: var(--text-faint);">
                      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto 12px;display:block;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                      No hay conversaciones.
                    </p>
                  </div>
                </div>
                <div class="wa-chat" x-show="selectedConv">
                  <template x-if="selectedConv">
                    <div class="wa-chat">
                      <div class="wa-chat-header">
                        <div class="wa-chat-header-left">

                          <div>
                            <div class="wa-chat-name" x-text="selectedConv.contacto?.nombre || selectedConv.contacto?.wa_id"></div>
                            <div class="wa-chat-number" x-text="selectedConv.contacto?.wa_id"></div>

                          </div>
                        </div>
                        <button class="wa-take-btn" @click="tomarConv()" x-show="selectedConv.conversacion?.modo==='humano' && (!selectedConv.conversacion?.agente_id || selectedConv.conversacion?.agente_id !== user.id)">
                          <span>Tomar</span>
                        </button>
                        <button class="wa-release-btn" @click="soltarConv()" x-show="selectedConv.conversacion?.modo==='humano' && selectedConv.conversacion?.agente_id === user.id">
                          <span>Soltar</span>
                        </button>
                        <button class="wa-chat-gear" @click="chatMenuOpen = !chatMenuOpen">
                          <svg fill="currentColor" viewBox="0 0 24 24" style="width:20px;height:20px;"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                        </button>
                        <div class="wa-chat-menu" x-show="chatMenuOpen" @click.outside="chatMenuOpen = false">
                          <button x-show="selectedConv.contacto?.deleted" @click="restaurarContacto(); chatMenuOpen = false" class="wa-chat-menu-item">Agregar</button>
                          <button x-show="selectedConv.conversacion?.modo==='humano'" @click="toggleIaConv(); chatMenuOpen = false" class="wa-chat-menu-item">Activar IA</button>
                          <button x-show="selectedConv.conversacion?.modo==='ia'" @click="toggleIaConv(); chatMenuOpen = false" class="wa-chat-menu-item">Desactivar IA</button>
                          <button @click="deleteConv(); chatMenuOpen = false" class="wa-chat-menu-item" style="color: var(--danger);">Eliminar conversación</button>
                        </div>
                      </div>
                      <div class="wa-messages wa-scroll" x-ref="chatScroll">
                        <template x-for="m in selectedConv.mensajes" :key="m.id">
                          <div :class="m.direccion==='in' ? 'wa-bubble-in' : (m.origen==='ia' ? 'wa-bubble-ia' : 'wa-bubble-out')"

                               :style="swipeOffset(m) ? 'transform: translateX(' + swipeOffset(m) + 'px); transition: none;' : ''"
                               @contextmenu.prevent="openMsgContextMenu($event, m)"

                               @touchmove="onTouchMove($event, m)"
                               @touchend="onTouchEnd($event, m)">
                            <template x-if="m.reply_to_msg">
                              <div class="wa-reply-quote" @click.stop="scrollToMessage(m.reply_to_msg.id)">
                                <div class="wa-reply-quote-bar"></div>
                                <div class="wa-reply-quote-content">
                                  <span class="wa-reply-quote-author" x-text="m.reply_to_msg.direccion==='in' ? (selectedConv.contacto?.nombre || 'Cliente') : 'Asesor'"></span>
                                  <span class="wa-reply-quote-text" x-text="m.reply_to_msg.texto"></span>
                                </div>
                              </div>
                            </template>
                            <template x-if="m.forwarded">
                              <div class="wa-forwarded-label">↻ Reenviado</div>
                            </template>
                            <template x-if="m.tipo==='image'">
                              <div>
                                <img :src="m.contenido?.url?.startsWith('/uploads/') ? m.contenido.url : '/api/conversaciones/media/' + m.id + '?t=' + api.getToken()" style="max-width:280px;max-height:280px;border-radius:8px;margin-bottom:4px;object-fit:cover;cursor:pointer;" alt="imagen" @click="window.open($event.target.src, '_blank')" />
                                <p class="wa-bubble-text" x-show="m.contenido?.caption || m.contenido?.text" x-text="m.contenido?.caption || m.contenido?.text"></p>
                              </div>
                            </template>
                            <template x-if="m.tipo==='audio'">
                              <div>
                                <audio controls style="max-width:100%;height:36px;">
                                  <source :src="m.contenido?.url?.startsWith('/uploads/') ? m.contenido.url : '/api/conversaciones/media/' + m.id + '?t=' + api.getToken()" :type="m.contenido?.mimetype || 'audio/ogg'">
                                </audio>
                                <p class="wa-bubble-text" x-show="m.contenido?.caption" x-text="m.contenido?.caption"></p>
                              </div>
                            </template>
                            <template x-if="m.tipo==='document'">
                              <div>
                                <a :href="m.contenido?.url?.startsWith('/uploads/') ? m.contenido.url : '/api/conversaciones/media/' + m.id + '?t=' + api.getToken()" target="_blank" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
                                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:20px;height:20px;flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/></svg>
                                  <span class="wa-bubble-text" x-text="m.contenido?.filename || m.contenido?.text || 'Documento'"></span>
                                </a>
                                <p class="wa-bubble-text" x-show="m.contenido?.caption" x-text="m.contenido?.caption"></p>
                              </div>
                            </template>
                            <template x-if="m.tipo==='video'">
                              <div>
                                <video controls style="max-width:100%;border-radius:8px;margin-bottom:4px;">
                                  <source :src="m.contenido?.url?.startsWith('/uploads/') ? m.contenido.url : '/api/conversaciones/media/' + m.id + '?t=' + api.getToken()">
                                </video>
                                <p class="wa-bubble-text" x-show="m.contenido?.caption" x-text="m.contenido?.caption"></p>
                              </div>
                            </template>
                            <template x-if="m.tipo==='location'">
                              <p class="wa-bubble-text">📍 <a :href="'https://maps.google.com/?q=' + (m.contenido?.lat||'') + ',' + (m.contenido?.lng||'')" target="_blank" style="color:inherit;">Ubicacion</a></p>
                            </template>
                            <template x-if="['text','interactive','button','template'].includes(m.tipo)">
                              <p class="wa-bubble-text" x-text="m.contenido?.text || m.contenido?.body || m.contenido?.caption || m.contenido?.title || '[' + m.tipo + ']'"></p>

                              <span x-show="m.origen==='bot'">🤖</span>
                              <span x-show="m.origen==='ia'">🧠</span>
                              <span x-show="m.origen==='humano'">👤</span>
                            </div>
                          </div>
                        </template>
                      </div>

                      <!-- Context menu de mensaje (PC: right-click) -->
                      <div x-show="msgContextMenu.open" @click.outside="closeMsgContextMenu()" class="wa-msg-context-menu" :style="'top:' + msgContextMenu.y + 'px; left:' + msgContextMenu.x + 'px'">
                        <button @click="startReply(getMsgById(msgContextMenu.messageId))" class="wa-msg-context-item">
                          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                          <span>Responder</span>
                        </button>
                        <button @click="openForwardModal(getMsgById(msgContextMenu.messageId))" class="wa-msg-context-item">
                          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
                          <span>Reenviar</span>
                        </button>
                      </div>

                      <!-- Barra de reply (cita sobre el input) -->
                      <template x-if="replyToMsg">
                        <div class="wa-reply-bar">
                          <div class="wa-reply-bar-info">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:18px;height:18px;flex-shrink:0;color:var(--accent);"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                            <div class="wa-reply-bar-content">
                              <span class="wa-reply-bar-author" x-text="replyToMsg.direccion==='in' ? (selectedConv.contacto?.nombre || 'Cliente') : 'Asesor'"></span>
                              <span class="wa-reply-bar-text" x-text="getMsgPreview(replyToMsg)"></span>
                            </div>
                          </div>
                          <button @click="cancelReply()" class="wa-reply-bar-close">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                          </button>
                        </div>
                      </template>

                      <div class="wa-msg-bar">
                        <template x-if="ventanaExpirada">
                          <div class="wa-warning">
                            <span>Ventana de 24h expirada. Usa una plantilla para reabrir.</span>
                            <input x-model="templateName" class="wa-msg-input" style="width: 160px; flex: none;" placeholder="nombre_template" />
                            <button @click="enviarTemplate()" class="wa-btn">Enviar plantilla</button>
                          </div>
                        </template>
                        <template x-if="selectedConv.conversacion?.modo==='humano' && selectedConv.conversacion?.agente_id && selectedConv.conversacion?.agente_id !== user.id">
                          <div class="wa-locked-bar">
                            <span>🔒 Esta conversación está siendo atendida por <strong x-text="selectedConv.conversacion?.agente_username || 'otro agente'"></strong></span>
                          </div>
                        </template>
                        <template x-if="selectedConv.conversacion?.modo==='humano' && (!selectedConv.conversacion?.agente_id || selectedConv.conversacion?.agente_id === user.id)">
                          <div class="flex items-center w-full gap-2">
                            <button class="wa-clip-btn" @click="$refs.chatFile.click()" x-show="chatFilePending.length===0">
                              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                            <input type="file" multiple x-ref="chatFile" @change="previewChatFile($event)" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp,.mp3,.ogg,.wav" style="display:none;" />
                            <input x-model="manualMsg" @keydown.enter.prevent="sendManual()" class="wa-msg-input" placeholder="Escribe un mensaje..." x-ref="chatInput" />
                            <button class="wa-send-icon-btn" @click="sendManual()" x-show="manualMsg.trim()">
                              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
                            </button>
                          </div>
                        </template>
                      </div>
                      <p x-show="selectedConv.conversacion?.modo!=='humano'" class="wa-hint" style="padding: 0 16px 8px; background: var(--bg-main); margin: 0;">La conversación está siendo manejada por <span x-text="selectedConv.conversacion?.modo==='bot' ? 'bot' : 'IA'"></span>. Espera a que escale a humano para responder.</p>

                      <!-- Overlay de vista previa de archivos (estilo WhatsApp) -->
                      <div class="wa-attach-overlay" x-show="chatFilePending.length > 0" x-transition.duration.200ms>
                        <div class="wa-attach-header">
                          <button @click="cancelAttach()" class="wa-attach-close">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                          </button>
                          <span class="wa-attach-title" x-text="chatFilePending.length === 1 ? 'Enviar archivo' : 'Enviar ' + chatFilePending.length + ' archivos'"></span>
                          <button @click="$refs.chatFile.click()" class="wa-attach-add-btn">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                          </button>
                        </div>
                        <div class="wa-attach-preview">
                          <!-- Flecha izquierda -->
                          <button @click="prevFile()" class="wa-attach-arrow wa-attach-arrow-left" x-show="chatFileIndex > 0">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:28px;height:28px;"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                          </button>
                          <!-- Vista previa del archivo actual -->
                          <div class="wa-attach-current">
                            <button @click="removeAttachFile(chatFileIndex)" class="wa-attach-item-remove">
                              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                            <template x-if="chatFilePending[chatFileIndex] && chatFilePending[chatFileIndex].type.startsWith('image/')">
                              <img :src="chatFilePreviewUrls[chatFileIndex]" class="wa-attach-img" alt="preview" />
                            </template>
                            <template x-if="chatFilePending[chatFileIndex] && chatFilePending[chatFileIndex].type.startsWith('video/')">
                              <video :src="chatFilePreviewUrls[chatFileIndex]" controls class="wa-attach-video"></video>
                            </template>
                            <template x-if="chatFilePending[chatFileIndex] && chatFilePending[chatFileIndex].type.startsWith('audio/')">
                              <div class="wa-attach-file">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" style="width:64px;height:64px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-3a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                <span class="wa-attach-file-name" x-text="chatFilePending[chatFileIndex]?.name"></span>
                              </div>
                            </template>
                            <template x-if="chatFilePending[chatFileIndex] && !chatFilePending[chatFileIndex].type.startsWith('image/') && !chatFilePending[chatFileIndex].type.startsWith('video/') && !chatFilePending[chatFileIndex].type.startsWith('audio/')">
                              <div class="wa-attach-file">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" style="width:64px;height:64px;"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/></svg>
                                <span class="wa-attach-file-name" x-text="chatFilePending[chatFileIndex]?.name"></span>
                              </div>
                            </template>
                          </div>
                          <!-- Flecha derecha -->
                          <button @click="nextFile()" class="wa-attach-arrow wa-attach-arrow-right" x-show="chatFileIndex < chatFilePending.length - 1">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:28px;height:28px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                          </button>
                          <!-- Contador -->
                          <span class="wa-attach-counter" x-show="chatFilePending.length > 1" x-text="(chatFileIndex + 1) + '/' + chatFilePending.length"></span>
                        </div>
                        <div class="wa-attach-footer">
                          <input x-model="manualMsg" @keydown.enter.prevent="sendManual()" class="wa-msg-input" placeholder="Escribe un mensaje..." />
                          <button class="wa-send-icon-btn" @click="sendManual()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
                          </button>
                        </div>
                      </div>

                      <!-- Modal de reenviar mensajes -->
                      <div x-show="forwardModal.open" class="wa-forward-overlay" x-transition.duration.200ms>
                        <div class="wa-forward-modal">
                          <div class="wa-forward-header">
                            <button @click="closeForwardModal()" class="wa-forward-close">
                              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                            <span class="wa-forward-title">Reenviar mensaje(s)</span>
                          </div>

                          <!-- Mensajes seleccionados -->
                          <div class="wa-forward-section">
                            <div class="wa-forward-section-title">Mensaje(s) a reenviar</div>
                            <div class="wa-forward-msgs">
                              <template x-for="(fm, idx) in forwardModal.messages" :key="fm.id">
                                <div class="wa-forward-msg-item">
                                  <span class="wa-forward-msg-text" x-text="getMsgPreview(fm)"></span>
                                  <button @click="removeForwardMessage(idx)" class="wa-forward-msg-remove">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                                  </button>
                                </div>
                              </template>
                            </div>
                          </div>

                          <!-- Buscador de contactos -->
                          <div class="wa-forward-search-wrap">
                            <input x-model="forwardModal.search" @input.debounce.300ms="searchForwardContactos()" class="wa-forward-search" placeholder="Buscar contacto..." />
                          </div>

                          <!-- Lista de contactos -->
                          <div class="wa-forward-contactos wa-scroll">
                            <template x-for="c in forwardModal.contactos" :key="c.id">
                              <div @click="toggleForwardContacto(c.id)" :class="forwardModal.selectedContactos.includes(c.id) ? 'wa-forward-contact-active' : ''" class="wa-forward-contact">
                                <div class="wa-forward-contact-check" :style="forwardModal.selectedContactos.includes(c.id) ? 'background:var(--accent);border-color:var(--accent);' : ''">
                                  <svg x-show="forwardModal.selectedContactos.includes(c.id)" fill="none" stroke="#fff" viewBox="0 0 24 24" stroke-width="3" style="width:14px;height:14px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <div class="wa-forward-contact-avatar" :style="'background:' + avatarColor(c.nombre || c.wa_id) + ';color:#fff'" x-text="avatarIniciales(c.nombre || c.wa_id)"></div>
                                <div>
                                  <div class="wa-forward-contact-name" x-text="c.nombre || c.wa_id"></div>
                                  <div class="wa-forward-contact-num" x-text="c.wa_id"></div>
                                </div>
                              </div>
                            </template>
                            <p x-show="forwardModal.contactos.length===0" class="wa-forward-empty">No hay contactos.</p>
                          </div>

                          <!-- Resultado -->
                          <template x-if="forwardModal.result">
                            <div class="wa-forward-result">
                              <span x-text="forwardModal.result.enviados + ' enviados, ' + forwardModal.result.fallidos + ' fallidos'"></span>
                              <button @click="closeForwardModal()" class="wa-btn" style="margin-left:auto;">Cerrar</button>
                            </div>
                          </template>

                  <div class="tbl-page-controls">
                    <select class="tbl-per-page" @change="tblPerPage('tblNotifUsuarios',Number($event.target.value))"><option value="10">10 por pagina</option><option value="25">25 por pagina</option><option value="50">50 por pagina</option><option value="100">100 por pagina</option></select>
                    <button class="tbl-page-btn" @click="tblPage('tblNotifUsuarios','prev')" :disabled="tblNotifUsuarios.page===1">‹</button>
                    <span class="tbl-page-info" x-text="tblNotifUsuarios.page + ' / ' + tblData('tblNotifUsuarios',notifUsuarios).totalPages"></span>
                    <button class="tbl-page-btn" @click="tblPage('tblNotifUsuarios','next')" :disabled="tblNotifUsuarios.page>=tblData('tblNotifUsuarios',notifUsuarios).totalPages">›</button>
                  </div>
                </div>
                <p class="field-help" style="margin-top: 12px;"><strong>Recurrencia:</strong> envia notificaciones repetidas cada N minutos hasta que el empleado inicie sesion en el software. La notificacion incluye la URL del software para que el empleado ingrese y detenga las notificaciones.</p>
              </div>
              </template>

              <template x-if="subtab==='notif-log'">
              <div class="card">
                <h2 class="card-title">Historial de notificaciones enviadas</h2>
                <div class="overflow-x-auto">
                  <table class="tbl">
                    <thead><tr>
                      <th @click="tblSort('tblNotifLog','created_at')" :class="tblNotifLog.sortCol==='created_at' ? 'th-sort th-sort-active' : 'th-sort'">Fecha <span class="th-sort-icon" x-text="tblNotifLog.sortCol==='created_at' ? (tblNotifLog.sortDir==='asc' ? '▲' : '▼') : '↕'"></span></th>
                      <th @click="tblSort('tblNotifLog','username')" :class="tblNotifLog.sortCol==='username' ? 'th-sort th-sort-active' : 'th-sort'">Usuario <span class="th-sort-icon" x-text="tblNotifLog.sortCol==='username' ? (tblNotifLog.sortDir==='asc' ? '▲' : '▼') : '↕'"></span>
                        <div class="th-filter" @click.stop><input type="text" placeholder="Filtrar..." @input="tblFilter('tblNotifLog','username',$event.target.value)" /></div>
                      </th>
                      <th @click="tblSort('tblNotifLog','via')" :class="tblNotifLog.sortCol==='via' ? 'th-sort th-sort-active' : 'th-sort'">Via <span class="th-sort-icon" x-text="tblNotifLog.sortCol==='via' ? (tblNotifLog.sortDir==='asc' ? '▲' : '▼') : '↕'"></span>
                        <div class="th-filter" @click.stop><select @change="tblFilter('tblNotifLog','via',$event.target.value)"><option value="">Todas</option><option value="whatsapp">whatsapp</option><option value="email">email</option></select></div>
                      </th>
                      <th>Destino</th>
                      <th @click="tblSort('tblNotifLog','estado')" :class="tblNotifLog.sortCol==='estado' ? 'th-sort th-sort-active' : 'th-sort'">Estado <span class="th-sort-icon" x-text="tblNotifLog.sortCol==='estado' ? (tblNotifLog.sortDir==='asc' ? '▲' : '▼') : '↕'"></span>
                        <div class="th-filter" @click.stop><select @change="tblFilter('tblNotifLog','estado',$event.target.value)"><option value="">Todos</option><option value="ok">ok</option><option value="error">error</option></select></div>
                      </th>
                      <th>Mensaje</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="l in tblData('tblNotifLog',notifLog).rows" :key="l.id">
                        <tr>
                          <td class="text-sm" x-text="l.created_at"></td>
                          <td x-text="l.username || '-'"></td>
                          <td><span class="badge" :class="l.via==='whatsapp' ? 'badge-bot' : 'badge-info'" x-text="l.via"></span></td>
                          <td class="text-sm" x-text="l.destino"></td>
                          <td><span class="badge" :class="l.estado==='ok' ? 'badge-ok' : 'badge-no'" x-text="l.estado"></span></td>
                          <td class="text-sm" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" x-text="l.mensaje"></td>
                        </tr>
                      </template>
                      <tr x-show="notifLog.length===0"><td colspan="6" class="text-center text-sm" style="color:var(--text-faint);">Sin notificaciones enviadas.</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="tbl-pagination">
                  <span class="tbl-page-info" x-text="'Mostrando ' + tblData('tblNotifLog',notifLog).rows.length + ' de ' + tblData('tblNotifLog',notifLog).total + ' registros'"></span>
                  <div class="tbl-page-controls">
                    <select class="tbl-per-page" @change="tblPerPage('tblNotifLog',Number($event.target.value))"><option value="10">10 por pagina</option><option value="25">25 por pagina</option><option value="50">50 por pagina</option><option value="100">100 por pagina</option></select>
                    <button class="tbl-page-btn" @click="tblPage('tblNotifLog','prev')" :disabled="tblNotifLog.page===1">‹</button>
                    <span class="tbl-page-info" x-text="tblNotifLog.page + ' / ' + tblData('tblNotifLog',notifLog).totalPages"></span>
                    <button class="tbl-page-btn" @click="tblPage('tblNotifLog','next')" :disabled="tblNotifLog.page>=tblData('tblNotifLog',notifLog).totalPages">›</button>
                  </div>
                </div>
              </div>
              </template>
            </div>
          </template>

          <!-- ===== MENSAJES MASIVOS ===== -->
          <template x-if="tab==='masivos'">
            <div>
              <div class="flex items-center justify-between mb-6">
                <h2 class="card-title" style="margin:0;">Mensajes Masivos <span class="text-faint font-normal text-sm">(envío en volumen)</span></h2>
                <button @click="openNewMasivo()" class="btn-primary btn-sm">+ Agregar mensaje</button>
              </div>
              <div class="space-y-4">
                <template x-if="masivos.length === 0">
                  <div class="card" style="text-align:center; padding:40px;">
                    <p class="text-secondary mb-4">No hay mensajes masivos creados.</p>
                    <button @click="openNewMasivo()" class="btn-primary">Crear mensaje masivo</button>
                  </div>
                </template>
                <template x-for="m in masivos" :key="m.id">
                  <div class="card">
                    <div class="flex items-start justify-between">
                      <div class="flex-1">
                        <h3 class="font-semibold text-lg" style="margin:0 0 4px;" x-text="m.nombre"></h3>
                        <p class="text-sm text-secondary mb-2" x-text="(m.mensaje || '').slice(0, 80) + ((m.mensaje || '').length > 80 ? '...' : '')"></p>
                        <div class="flex flex-wrap gap-x-6 gap-y-1 text-sm text-secondary">
                          <span><strong>Destino:</strong> <span x-text="m.enviar_a_todos ? 'Todos los contactos' : (m.contactos || []).length + ' contacto(s)'"></span></span>
                          <span><strong>Estado:</strong> <span class="badge" :class="m.estado==='enviado' ? 'badge-ok' : 'badge-info'" x-text="m.estado"></span></span>
                          <span x-show="m.estado==='enviado'"><strong>Enviados:</strong> <span x-text="m.enviados + '/' + m.total"></span></span>
                          <span x-show="m.fallidos > 0"><strong>Fallidos:</strong> <span style="color: var(--danger);" x-text="m.fallidos"></span></span>
                        </div>
                      </div>
                      <div class="flex items-center gap-2 ml-4">
                        <button @click="enviarMasivo(m)" :disabled="masivoEnviando" class="btn-primary btn-sm">Enviar</button>
                        <div class="relative">
                          <button @click.stop="userMenuOpen === ('masivo-'+m.id) ? userMenuOpen = null : userMenuOpen = ('masivo-'+m.id)" class="btn-ghost btn-sm">Opciones ▾</button>
                          <template x-if="userMenuOpen === ('masivo-'+m.id)">
                            <div class="dropdown" @click.outside="userMenuOpen = null">
                              <button @click="openEditMasivo(m); userMenuOpen = null" class="dropdown-item">Editar</button>
                              <button @click="deleteMasivo(m); userMenuOpen = null" class="dropdown-item dropdown-item-danger">Eliminar</button>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="masivoModalOpen" class="modal-overlay" @click.self="closeMasivoModal()">
                <div class="modal-box" style="max-width: 600px;">
                  <div class="flex items-center justify-between mb-5">
                    <h3 class="card-title" style="margin:0;" x-text="masivoEdit ? 'Editar mensaje masivo' : 'Nuevo mensaje masivo'"></h3>
                    <button @click="closeMasivoModal()" class="btn-ghost btn-sm">✕</button>
                  </div>
                  <div class="field"><label class="field-label">Nombre *</label><input x-model="masivoForm.nombre" class="input" placeholder="Ej: Promoción de enero" /></div>
                  <div class="field"><label class="field-label">Mensaje libre (dentro de ventana 24h)</label><textarea x-model="masivoForm.mensaje" rows="3" class="input" placeholder="Escribe el mensaje..."></textarea></div>
                  <div class="field">
                    <label class="field-label">Adjuntar archivo <span class="text-faint font-normal">(PDF, Word o imagen)</span></label>
                    <input type="file" @change="uploadDocMasivo($event)" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp" style="font-size: 13px;" />
                    <template x-if="masivoForm.archivo_adjunto">
                      <div class="flex items-center gap-2 mt-2">
                        <span class="text-sm" x-text="'📎 ' + masivoForm.archivo_adjunto.name"></span>
                        <button @click="removeDocMasivo()" class="btn-ghost btn-sm" style="font-size: 11px;">quitar</button>
                      </div>
                    </template>
                  </div>
                  <div class="form-grid">
                    <div class="field"><label class="field-label">Template (fuera de 24h)</label><input x-model="masivoForm.template_name" class="input" placeholder="nombre_template" /></div>
                    <div class="field"><label class="field-label">Idioma</label><input x-model="masivoForm.language" class="input" placeholder="es_MX" /></div>
                  </div>
                  <div class="field">
                    <label class="flex items-center gap-3"><label class="switch"><input type="checkbox" x-model="masivoForm.enviar_a_todos" @change="checkVentanaMasivo()" /><span class="slider"></span></label><span class="text-sm font-semibold">Enviar a todos los contactos</span></label>
                  </div>
                  <div class="field" x-show="!masivoForm.enviar_a_todos">
                    <label class="field-label">Contactos</label>
                    <input x-model="masivoSearch" @input.debounce.300ms="loadMasivoContactos()" class="input mb-3" placeholder="Buscar contactos..." />
                    <div style="max-height: 200px; overflow-y: auto;" class="wa-scroll">
                      <template x-for="c in masivoContactos" :key="c.id">
                        <label class="flex items-center gap-3 py-2 px-3 rounded-lg" style="cursor: pointer;" :style="masivoForm.contactos.includes(c.id) ? 'background: var(--bg-hover);' : ''">
                          <input type="checkbox" :checked="masivoForm.contactos.includes(c.id)" @change="toggleMasivoContacto(c.id)" />
                          <span class="text-sm" x-text="(c.nombre || c.wa_id)"></span>
                        </label>
                      </template>
                    </div>
                  </div>
                  <div class="field" x-show="masivoVentana.total > 0">
                    <p class="field-help">
                      <strong>Ventana 24h:</strong> <span x-text="mas+masivoVentana.dentro_24h"></span> dentro de ventana, <span x-text="masivoVentana.fuera_24h"></span> fuera de ventana.
                    </p>
                  </div>
                  <div class="flex-actions">
                    <button @click="saveMasivo()" :disabled="masivoSaving" class="btn-primary"><span x-show="!masivoSaving">Guardar</span><span x-show="masivoSaving">Guardando...</span></button>
                    <button @click="closeMasivoModal()" class="btn-secondary">Cancelar</button>
                  </div>
                </div>
              </div>
            </div>
          </template>

          </div>
        </main>
      </div>
    </div>
  </template>

  <!-- Modal de confirmacion -->
  <div x-show="confirmModal.open" class="modal-overlay" @click.self="confirmCancel()" style="z-index: 60;">
    <div class="modal-box" style="max-width: 440px;">
      <div class="flex items-start gap-4 mb-5">
        <div style="width:44px;height:44px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:24px;height:24px;color:var(--danger);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <div style="flex:1;">
          <h3 class="card-title" style="margin:0 0 8px;" x-text="confirmModal.title"></h3>
          <p class="text-sm" style="color:var(--text-soft);line-height:1.5;margin:0;" x-text="confirmModal.message"></p>
        </div>
      </div>
      <div class="flex gap-3">
        <button @click="confirmYes()" class="btn-danger flex-1">Confirmar</button>
        <button @click="confirmCancel()" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast" x-transition class="toast">
    <svg class="toast-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span x-text="toast"></span>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
